<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  min-height: 100vh; color: #fff; padding: 20px;
}
.container { max-width: 640px; margin: 0 auto; }
.card {
  background: rgba(255,255,255,0.06); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px); border-radius: 24px;
  padding: 32px; margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.title {
  font-size: 32px; font-weight: 800; text-align: center;
  background: linear-gradient(90deg, #ff6b6b, #feca57);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px; letter-spacing: 2px;
}
.subtitle { text-align: center; color: #a0a0b0; font-size: 14px; margin-bottom: 28px; }
.filter-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
.filter-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: #a0a0b0; padding: 8px 18px; border-radius: 24px;
  font-size: 13px; cursor: pointer; white-space: nowrap; transition: all .25s;
  font-family: inherit;
}
.filter-btn:hover { background: rgba(255,255,255,0.1); }
.filter-btn.active {
  background: linear-gradient(90deg, rgba(255,107,107,0.25), rgba(254,202,87,0.25));
  color: #feca57; border-color: rgba(254,202,87,0.4); font-weight: 600;
}
.movie-display {
  background: rgba(0,0,0,0.25); border-radius: 20px; padding: 36px 24px;
  text-align: center; min-height: 260px;
  display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
}
.empty-state { color: #8892b0; font-size: 16px; }
.empty-state .icon { font-size: 56px; margin-bottom: 16px; display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.movie-title { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.3; }
.movie-original { font-size: 14px; color: #8892b0; margin-bottom: 14px; font-style: italic; }
.movie-meta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.meta-tag {
  background: rgba(255,255,255,0.08); color: #ccd6f6;
  padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.meta-tag.source-imdb { background: rgba(245,197,24,0.12); color: #f5c518; }
.meta-tag.source-douban { background: rgba(0,180,0,0.12); color: #00e676; }
.meta-tag.source-both { background: linear-gradient(90deg, rgba(245,197,24,0.15), rgba(0,180,0,0.15)); color: #ffd700; }
.genre-cloud { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
.genre-tag { background: rgba(255,255,255,0.05); color: #a0a0b0; padding: 3px 10px; border-radius: 12px; font-size: 11px; }
.rating { font-size: 36px; font-weight: 800; color: #feca57; margin: 6px 0 10px; }
.movie-desc { color: #ccd6f6; font-size: 14px; line-height: 1.7; max-width: 520px; margin: 0 auto; }
.director { margin-top: 14px; font-size: 12px; color: #8892b0; }
.btn {
  width: 100%; padding: 18px; border: none; border-radius: 16px;
  font-size: 18px; font-weight: 700; cursor: pointer; transition: all .3s;
  margin-top: 18px; font-family: inherit;
}
.btn-primary { background: linear-gradient(90deg, #ff6b6b, #feca57); color: #1a1a2e; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,107,107,0.35); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-secondary { background: rgba(255,255,255,0.06); color: #ccd6f6; margin-top: 12px; font-size: 14px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); }
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
.stats { display: flex; justify-content: space-around; text-align: center; }
.stat-num { font-size: 26px; font-weight: 800; color: #feca57; }
.stat-label { font-size: 12px; color: #8892b0; margin-top: 4px; }
.history { margin-top: 4px; }
.history-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #ccd6f6; }
.history-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.history-item {
  background: rgba(255,255,255,0.04); border-radius: 12px;
  padding: 10px 14px; min-width: 130px; text-align: center;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
  transition: all .2s; flex-shrink: 0;
}
.history-item:hover { background: rgba(255,107,107,0.12); border-color: rgba(255,107,107,0.25); }
.history-item-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item-year { font-size: 11px; color: #8892b0; margin-top: 4px; }
.footer { text-align: center; color: #555; font-size: 12px; margin-top: 20px; }
@media (max-width: 480px) {
  .card { padding: 22px; }
  .title { font-size: 26px; }
  .movie-title { font-size: 22px; }
}
</style>

<div class="container">

      <button class="filter-btn" onclick="setFilter('豆瓣',this)">仅 豆瓣</button>
      <button class="filter-btn" onclick="setFilter('both',this)">双榜重合</button>
    </div>
    <div class="movie-display" id="display">
      <div class="empty-state"><span class="icon">🎬</span><div>点击下方按钮，随机抽取今日电影</div></div>
    </div>
    <button class="btn btn-primary" id="drawBtn" onclick="drawMovie()">🎲 随机抽取一部电影</button>
    <button class="btn btn-secondary" onclick="showAllMovies()">📋 查看完整片单</button>
  </div>
  <div class="card stats">

    <div><div class="stat-num" id="bothCount">0</div><div class="stat-label">双榜重合</div></div>
  </div>
  <div class="card history" id="historyCard" style="display:none;">
    <div class="history-title">📜 抽取记录</div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div class="footer">数据来源：IMDb Top 250 & 豆瓣电影 Top 250 · 合并去重精选</div>
</div>

let currentFilter = 'all';
let history = [];
let isSpinning = false;

function getFilteredMovies() {
  if (currentFilter === 'all') return movies;
  if (currentFilter === 'both') return movies.filter(m => m.s.length > 1);
  return movies.filter(m => m.s.includes(currentFilter));
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateStats();
}

function updateStats() {
  const filtered = getFilteredMovies();
  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('imdbCount').textContent = movies.filter(m => m.s.includes('IMDb')).length;
  document.getElementById('doubanCount').textContent = movies.filter(m => m.s.includes('豆瓣')).length;
  document.getElementById('bothCount').textContent = movies.filter(m => m.s.length > 1).length;
}

function getSourceClass(sources) {
  if (sources.length > 1) return 'source-both';
  return sources[0] === 'IMDb' ? 'source-imdb' : 'source-douban';
}

function getSourceLabel(sources) {
  if (sources.length > 1) return 'IMDb × 豆瓣';
  return sources[0];
}

function renderMovie(m) {
  return '<div style="animation:fadeIn .5s ease">' +
    '<div class="movie-title">' + m.t + '</div>' +
    '<div class="movie-original">' + m.o + '</div>' +
    '<div class="movie-meta">' +
      '<span class="meta-tag">' + m.y + '</span>' +
      '<span class="meta-tag ' + getSourceClass(m.s) + '">' + getSourceLabel(m.s) + '</span>' +
      '<span class="meta-tag">' + m.c + '</span>' +
    '</div>' +
    '<div class="genre-cloud">' + m.g.split('/').map(g => '<span class="genre-tag">' + g + '</span>').join('') + '</div>' +
    '<div class="rating">★ ' + m.r + '</div>' +
    '<div class="movie-desc">' + m.desc + '</div>' +
    '<div class="director">导演：' + m.d + '</div>' +
  '</div>';
}

function drawMovie() {
  if (isSpinning) return;
  const pool = getFilteredMovies();
  if (pool.length === 0) return;
  isSpinning = true;
  const btn = document.getElementById('drawBtn');
  btn.disabled = true;
  btn.textContent = '🎰 抽取中...';
  const display = document.getElementById('display');
  let count = 0;
  const maxSpins = 15;
  const interval = setInterval(() => {
    const random = pool[Math.floor(Math.random() * pool.length)];
    display.innerHTML = renderMovie(random);
    count++;
    if (count >= maxSpins) {
      clearInterval(interval);
      const final = pool[Math.floor(Math.random() * pool.length)];
      display.innerHTML = renderMovie(final);
      addToHistory(final);
      isSpinning = false;
      btn.disabled = false;
      btn.textContent = '🎲 再抽一部';
    }
  }, 80);
}

function addToHistory(m) {
  history.unshift(m);
  if (history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  const card = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  if (history.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  list.innerHTML = history.map(m =>
    '<div class="history-item" onclick="showMovieByTitle('' + m.t.replace(/'/g, "\'") + '')">' +
      '<div class="history-item-title">' + m.t + '</div>' +
      '<div class="history-item-year">' + m.y + ' · ★' + m.r + '</div>' +
    '</div>'
  ).join('');
}

function showMovieByTitle(title) {
  const m = movies.find(x => x.t === title);
  if (m) document.getElementById('display').innerHTML = renderMovie(m);
}

function showAllMovies() {
  const pool = getFilteredMovies();
  const list = pool.map((m, i) => (i+1) + '. ' + m.t + ' (' + m.y + ') ★' + m.r + ' [' + m.s.join('+') + ']').join('
');
  alert('当前筛选：' + (currentFilter === 'all' ? '全部' : currentFilter) + '
共 ' + pool.length + ' 部影片

' + list.substring(0, 2000) + (list.length > 2000 ? '...' : ''));
}

updateStats();
